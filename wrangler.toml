name = "alert-notifications"
main = "src/worker/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "alert_notifications"
database_id = "bad7377a-e360-41aa-9e1e-845988668dec"
migrations_dir = "src/storage/migrations"

[vars]
DELIVERY_MODE = "fake"
